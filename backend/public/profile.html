async function loadData({a12Only=false}={}){try{const [profileRes,settingsRes]=await Promise.all([authorizedFetch('/api/web/profile',{cache:'no-store'}),fetch('/api/web/settings',{cache:'no-store'})]);if(profileRes.status===401){toast('登录状态已失效，请重新登录','error');setTimeout(logout,900);return}if(!profileRes.ok)throw new Error();profileData=await profileRes.json();const settings=settingsRes.ok?await settingsRes.json().catch(()=>({})):{};platformContactText=String(settings.contactText||'');inviteContactText=String(settings.inviteContactText||'');creator=profileData.creator;const name=creator?.brandName||'主理人';document.getElementById('sideName').textContent=name;document.getElementById('sideSlogan').textContent=creator?.slogan||'';document.querySelectorAll('#topAvatar,#sideAvatar').forEach(el=>{renderPrivateAvatar(el,creator);el.classList.toggle('has-unread',(profileData.unreadCount||0)>0)});if(!imagesDirty)resetImageDraft();resetIdentityDraft();renderBrand();renderImages();renderIdentity();if(a12Only)return;if(!profileSignalsDirty)resetProfileSignalsDraft();renderProfileSignals();renderInbox();renderAccount();renderContact();hydratePrivateImages();loadActivities();updateReminders();if(imagesDirty&&imageSaveState==='idle')void saveImages()}catch(e){toast('加载失败，请刷新重试','error')}}
async function loadTags(){try{const res=await fetch('/api/tags'),data=await res.json();allTags=(data.tags||[]).filter(t=>TAG_CATEGORIES.includes(t.category)&&t.status==='active')}catch(e){allTags=[]}}
async function loadVenueTags(){try{const res=await fetch('/api/web/venue-tags'),data=await res.json();venueTagsConfig=data.tags||venueTagsConfig}catch(e){toast('场地标签加载失败','error')}}
function scheduleSessionKey(){const id=creator&&(creator.id||creator.publicId||creator.phone);return id?`tde:a1-3:schedule-seen:${id}`:''}
function getScheduleSeen(){try{return sessionStorage.getItem(scheduleSessionKey())}catch(e){return null}}
function markScheduleSeen(){try{const key=scheduleSessionKey();if(key)sessionStorage.setItem(key,'1')}catch(e){}}
async function hydrateScheduleFrame(frame){if(!frame||frame.dataset.hydrated==='1')return;const source=frame.dataset.scheduleSrc;if(!source)return;const response=await fetch(source,{cache:'no-store'});if(!response.ok)throw new Error('档期页面加载失败');const html=await response.text();const query=new URL(source,location.href).search.replace(/'/g,"\\'");frame.srcdoc=html.replace('<head>','<head><base href="'+location.origin+'/">').replace("const SCHEDULE_PARAMS = new URLSearchParams(location.search);","const SCHEDULE_PARAMS = new URLSearchParams('"+query+"');");frame.dataset.hydrated='1'}
function showA13Schedule(){document.getElementById('a12Shell').hidden=true;document.getElementById('legacyPage').hidden=true;document.getElementById('a13Shell').hidden=false;document.getElementById('a13ScheduleFrame').hidden=false;document.getElementById('a13Next').hidden=true;hydrateScheduleFrame(document.getElementById('a13ScheduleFrame')).catch(error=>toast(error.message,'error'))}
function completeA13Schedule(){markScheduleSeen();if(sessionStorage.getItem('tde:onboarding-v2')==='1'){location.replace('profile.html?section=signals&onboarding=1');return}location.replace('profile.html?section=schedule')}
async function init(){const params=new URLSearchParams(location.search),requestedSection=params.get('section'),section=sectionAliases[requestedSection]||requestedSection;if(!requestedSection){location.replace('profile.html?section=schedule');return}if(requestedSection==='portrait'){location.replace('profile.html?section=overview');return}if(profileOverviewRequested){await loadData();renderProfileOverview();return}if(section&&allSections.some(s=>s[0]===section))activeSection=section;if(requestedSection==='brand'){await loadLocations();await loadData({a12Only:true});return}if(requestedSection==='schedule'){await loadLocations();await loadData({a12Only:true});showA13Schedule();return}buildNav();await loadData();switchSection(activeSection)}
