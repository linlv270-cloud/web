<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的体验｜奇灯®TDE</title>
<style>
:root{--paper:#f8f6f1;--ink:#202020;--muted:#76736d;--line:#dedbd4;--soft:#eceae5}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif}
body{min-height:100vh}.topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:17px}.back{color:var(--ink);font-size:13px;text-decoration:none}
.page{width:min(720px,100%);margin:auto;padding:34px 18px 110px}.page h1{font-size:32px;line-height:1.15;margin:0}.lede{font-size:18px;line-height:1.55;margin:18px 0 34px;max-width:23em}
.section{margin-top:34px}.section-head{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}.section h2{font-size:20px;margin:0}.section-note{font-size:12px;color:var(--muted)}
.content-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.content-choice{min-height:50px;text-align:left;padding:12px 13px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:14px}.content-choice.selected{background:var(--soft);border-color:var(--ink);font-weight:800}
.experience-editor{border-top:1px solid var(--line);margin-top:36px;padding-top:28px}.template-copy{font-size:18px;line-height:2.25}.template-line{margin:0 0 9px}.template-line em{font-style:normal;display:inline-block;min-width:7em;border-bottom:1px solid var(--ink);color:var(--muted);font-size:15px;line-height:1.5;vertical-align:baseline;cursor:pointer}.template-line em.filled{color:var(--ink);font-weight:600}
.image-section{margin-top:30px}.image-section h3{font-size:15px;margin:0 0 10px}.image-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.image-card{position:relative;aspect-ratio:3/4;background:#fff;border:1px solid var(--line);overflow:hidden}.image-card img{width:100%;height:100%;object-fit:cover}.image-card button{position:absolute;top:6px;right:6px;width:28px;height:28px;border:1px solid var(--ink);background:#fff;font:inherit;font-size:18px;line-height:1}.image-card-label{position:absolute;left:0;right:0;bottom:0;padding:6px;background:rgba(255,255,255,.9);font-size:11px;line-height:1.3}.image-upload{display:grid;place-items:center;aspect-ratio:3/4;border:1px dashed #aaa;background:#fff;color:var(--ink);font-size:14px;cursor:pointer;text-align:center;padding:8px}.image-upload input{display:none}
.save-row{display:flex;align-items:center;gap:12px;margin-top:26px}.primary{border:2px solid var(--ink);background:var(--ink);color:#fff;padding:13px 20px;font:inherit;font-weight:800}.status{font-size:13px;color:var(--muted)}.status.error{color:#b3261e}.status.success{color:#16745c}.empty{padding:24px 0;color:var(--muted);font-size:14px}
.choice-sheet{position:fixed;inset:0;background:rgba(32,32,32,.18);display:none;align-items:end;z-index:10}.choice-sheet.show{display:flex}.sheet{width:100%;background:var(--paper);border-top:1px solid var(--ink);padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sheet h3{margin:0;font-size:18px}.sheet-close{border:0;background:transparent;font-size:24px}.sheet-options{display:flex;flex-wrap:wrap;gap:9px}.sheet-option{border:1px solid var(--line);background:#fff;padding:11px 13px;font:inherit}.sheet-option.selected{background:var(--soft);border-color:var(--ink);font-weight:800}.custom-input{display:none;margin-top:12px}.custom-input.show{display:block}.custom-input input,.text-value{width:100%;height:46px;border:1px solid var(--ink);padding:0 12px;font:inherit;background:#fff}.crop-modal{position:fixed;inset:0;background:rgba(32,32,32,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.crop-modal.show{display:flex}.crop-dialog{width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--paper);border:1px solid var(--ink);padding:18px}.crop-dialog h2{margin:0;font-size:19px}.crop-dialog p{margin:6px 0 14px}.crop-stage{background:#151515;border:1px solid var(--ink);overflow:hidden}.crop-stage canvas{display:block;width:100%;height:auto}.crop-controls{display:grid;gap:9px;margin:16px 0}.crop-control{display:grid;grid-template-columns:74px 1fr;align-items:center;gap:10px;font-size:12px}.crop-control input{width:100%;accent-color:var(--ink)}
@media(max-width:520px){.page{padding:28px 16px 100px}.page h1{font-size:29px}.lede{font-size:17px;margin-top:16px}.template-copy{font-size:16px;line-height:2.2}.template-line em{font-size:14px}.content-grid{gap:7px}}
</style>
</head>
<body>
<header class="topbar"><div class="brand">奇灯®TDE</div><a class="back" href="profile.html?section=schedule">返回</a></header>
<main class="page">
  <h1>我的体验</h1>
  <p class="lede">本次我会带来什么新鲜体验/产品？</p>
  <section class="section">
    <div class="section-head"><h2>我的体验</h2><span class="section-note">请选择一项</span></div>
    <div class="content-grid" id="contentGrid"></div>
  </section>
  <section class="experience-editor" id="experienceEditor" hidden>
    <div class="section-head"><h2>我的体验介绍</h2></div>
    <div class="template-copy" id="templateCopy"></div>
    <div class="image-section">
      <h3>体验图片</h3>
      <div class="image-grid" id="imageGrid"></div>
    </div>
    <div class="save-row"><button class="primary" id="saveExperience" type="button">保存</button><span class="status" id="experienceStatus"></span></div>
  </section>
  <section class="experience-editor" id="onboardingComplete" hidden>
    <h2>恭喜，品牌资料已经全部完成，记得到主理人档案及时更新并查看</h2>
    <div class="save-row"><a class="primary" href="profile.html?section=schedule">主理人档案</a></div>
  </section>
  <div class="empty" id="loadEmpty" hidden></div>
</main>
<div class="choice-sheet" id="choiceSheet"><div class="sheet"><div class="sheet-head"><h3 id="sheetTitle">填写</h3><button class="sheet-close" id="sheetClose" type="button">×</button></div><div class="sheet-options" id="sheetOptions"></div><div class="custom-input" id="customInput"><input id="customValue" maxlength="120"></div><div class="save-row"><button class="primary" id="sheetConfirm" type="button">确定</button></div></div></div>
<div class="crop-modal" id="experienceCropModal" role="dialog" aria-modal="true" aria-labelledby="experienceCropTitle"><div class="crop-dialog"><h2 id="experienceCropTitle">裁剪体验图片</h2><div class="crop-stage"><canvas id="experienceCropCanvas" width="1080" height="1440"></canvas></div><div class="crop-controls"><label class="crop-control"><span>缩放</span><input id="experienceCropZoom" type="range" min="100" max="300" value="100"></label><label class="crop-control"><span>左右位置</span><input id="experienceCropX" type="range" min="-100" max="100" value="0"></label><label class="crop-control"><span>上下位置</span><input id="experienceCropY" type="range" min="-100" max="100" value="0"></label></div><div class="save-row"><button class="primary" id="experienceCropConfirm" type="button">确认并上传</button><button class="sheet-close" id="experienceCropCancel" type="button">取消</button></div></div></div>
<script>
const $=id=>document.getElementById(id),token=()=>localStorage.getItem('tde_token')||'';
const mediaSlots=[{role:'creation',label:'创作过程图或产品图'},{role:'scene',label:'用户体验图或陈列图'},{role:'detail',label:'关键细节图'}];
const state={labels:[],selected:'',mappings:{},templates:{},experience:null,fields:{},choices:{},rawText:{},media:[],choiceKey:'',cropState:null};
const esc=value=>String(value??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,options={}){const res=await fetch(path,{...options,headers:{Authorization:'Bearer '+token(),...(options.headers||{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'操作失败');return data}
function setStatus(text,type=''){const node=$('experienceStatus');node.textContent=text;node.className='status '+type}
function currentTemplate(){return state.templates[state.mappings[state.selected]]||[]}
function renderContent(){ $('contentGrid').innerHTML=state.labels.map(label=>`<button class="content-choice ${state.selected===label?'selected':''}" type="button" data-content="${esc(label)}">${esc(label)}</button>`).join('');document.querySelectorAll('[data-content]').forEach(button=>button.onclick=()=>{state.selected=button.dataset.content;state.fields={};state.choices={};state.rawText={};state.media=[];renderContent();renderEditor()})}
function renderEditor(){const editor=$('experienceEditor');if(!state.selected){editor.hidden=true;return}editor.hidden=false;const template=currentTemplate();$('templateCopy').innerHTML=template.map(field=>{const value=field.kind==='choice'?state.choices[field.key]:state.fields[field.key];return `<p class="template-line">${esc(field.sentence)} <em class="${value?'filled':''}" data-field="${esc(field.key)}">${esc(value||'点击填写')}</em>。</p>`}).join('');renderImages()}
function renderImages(){const cards=mediaSlots.map(slot=>{const index=state.media.findIndex(item=>item.role===slot.role),item=index>=0?state.media[index]:null;return item?`<div class="image-card"><img src="${esc(item.preview||item.url)}" alt="${esc(slot.label)}"><span class="image-card-label">${esc(slot.label)}</span><button type="button" aria-label="删除图片" data-remove-image="${index}">×</button></div>`:`<label class="image-upload">${esc(slot.label)}<input type="file" accept="image/*" data-image-role="${slot.role}"></label>`}).join('');$('imageGrid').innerHTML=cards;document.querySelectorAll('[data-remove-image]').forEach(button=>button.onclick=()=>{state.media.splice(Number(button.dataset.removeImage),1);renderImages()});document.querySelectorAll('[data-image-role]').forEach(input=>input.addEventListener('change',event=>startExperienceCrop(event,input.dataset.imageRole)))}
function openChoice(key){const field=currentTemplate().find(item=>item.key===key);if(!field)return;state.choiceKey=key;$('sheetTitle').textContent=field.sentence;const current=field.kind==='choice'?state.choices[key]||'':state.fields[key]||'';const isCustom=field.kind==='choice'&&current!==''&&!(field.options||[]).includes(current);$('sheetOptions').innerHTML=field.kind==='choice'?(field.options||[]).map(option=>`<button class="sheet-option ${(!isCustom&&current===option)?'selected':''}" data-option="${esc(option)}" type="button">${esc(option)}</button>`).join(''):'<input id="textValue" class="text-value" maxlength="160">';if(field.kind==='text')$('textValue').value=current;if(field.kind==='choice'){$('customValue').value=isCustom?current:'';$('customInput').classList.toggle('show',isCustom)}else{$('customValue').value='';$('customInput').classList.remove('show')}document.querySelectorAll('[data-option]').forEach(button=>button.onclick=()=>{const option=button.dataset.option;if(option==='其他'){$('customInput').classList.add('show');$('customValue').focus()}else{state.choices[key]=option;state.rawText[key]=option;closeSheet();renderEditor()}});$('choiceSheet').classList.add('show')}
function closeSheet(){$('choiceSheet').classList.remove('show');state.choiceKey=''}
function drawExperienceCrop(){const crop=state.cropState;if(!crop)return;const canvas=$('experienceCropCanvas'),ctx=canvas.getContext('2d'),img=crop.image,zoom=Number($('experienceCropZoom').value)/100,panX=Number($('experienceCropX').value)/100,panY=Number($('experienceCropY').value)/100,scale=Math.max(canvas.width/img.naturalWidth,canvas.height/img.naturalHeight)*zoom,w=img.naturalWidth*scale,h=img.naturalHeight*scale,x=-(w-canvas.width)/2+panX*Math.max(0,w-canvas.width)/2,y=-(h-canvas.height)/2+panY*Math.max(0,h-canvas.height)/2;ctx.fillStyle='#151515';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,x,y,w,h)}
function closeExperienceCrop(){if(state.cropState?.url)URL.revokeObjectURL(state.cropState.url);state.cropState=null;$('experienceCropModal').classList.remove('show');document.body.style.overflow=''}
function startExperienceCrop(event,role){const file=event.target.files?.[0];event.target.value='';if(!file)return;if(!file.type.startsWith('image/')){setStatus('请选择图片文件','error');return}if(file.size>20*1024*1024){setStatus('图片不能超过 20MB','error');return}const url=URL.createObjectURL(file),image=new Image();image.onload=()=>{state.cropState={role,image,url};['experienceCropZoom','experienceCropX','experienceCropY'].forEach(id=>$(id).value=id==='experienceCropZoom'?'100':'0');$('experienceCropModal').classList.add('show');document.body.style.overflow='hidden';drawExperienceCrop()};image.onerror=()=>{URL.revokeObjectURL(url);setStatus('当前浏览器无法读取该照片格式','error')};image.src=url}
async function confirmExperienceCrop(){const crop=state.cropState;if(!crop)return;const button=$('experienceCropConfirm');button.disabled=true;button.textContent='上传中...';try{const blob=await new Promise((resolve,reject)=>$('experienceCropCanvas').toBlob(value=>value?resolve(value):reject(new Error('图片处理失败')),'image/jpeg',.86));const form=new FormData();form.append('file',new File([blob],`tde-experience-${Date.now()}.jpg`,{type:'image/jpeg'}));const data=await api('/api/web/upload',{method:'POST',body:form});state.media=state.media.filter(item=>item.role!==crop.role);state.media.push({role:crop.role,key:data.key,url:data.url,preview:URL.createObjectURL(blob)});closeExperienceCrop();renderImages()}catch(error){setStatus(error.message,'error')}finally{button.disabled=false;button.textContent='确认并上传'}}
function validDraft(){const missing=currentTemplate().find(field=>{const value=field.kind==='choice'?state.choices[field.key]:state.fields[field.key];return !String(value||'').trim()});if(missing){setStatus(`请完成：${missing.sentence}`,'error');document.querySelector(`[data-field="${CSS.escape(missing.key)}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});return false}if(!state.media.length){setStatus('请上传体验图片','error');$('imageGrid').scrollIntoView({behavior:'smooth',block:'center'});return false}return true}
async function saveExperience(){if(!validDraft())return;const button=$('saveExperience');button.disabled=true;setStatus('保存中');try{const data=await api('/api/web/onsite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'saveExperience',contentLabel:state.selected,fields:state.fields,choices:state.choices,rawText:state.rawText,media:state.media.map(item=>({role:item.role,key:item.key}))})});state.experience=data.experience;state.media=(data.experience.media||[]).map(item=>({role:item.role,key:item.key,url:data.experience.mediaUrls?.[item.key]||`/api/assets/${item.key.split('/').map(encodeURIComponent).join('/')}`}));setStatus('已保存','success');if(new URLSearchParams(location.search).get('onboarding')==='1'){document.getElementById('experienceEditor').hidden=true;document.getElementById('onboardingComplete').hidden=false;sessionStorage.removeItem('tde:onboarding-v2')}}catch(error){setStatus(error.message,'error')}finally{button.disabled=false}}
document.querySelector('[data-field]')?.addEventListener('click',()=>{});$('experienceEditor').addEventListener('click',event=>{const field=event.target.closest('[data-field]');if(field)openChoice(field.dataset.field)});$('sheetClose').onclick=closeSheet;$('choiceSheet').onclick=event=>{if(event.target===$('choiceSheet'))closeSheet()};$('sheetConfirm').onclick=()=>{const key=state.choiceKey,field=currentTemplate().find(item=>item.key===key);if(!field)return;const value=field.kind==='choice'?($('customValue').value.trim()||'其他'):$('textValue').value.trim();if(!value)return;if(field.kind==='choice')state.choices[key]=value;else state.fields[key]=value;state.rawText[key]=value;closeSheet();renderEditor()};['experienceCropZoom','experienceCropX','experienceCropY'].forEach(id=>$(id).addEventListener('input',drawExperienceCrop));$('experienceCropConfirm').onclick=confirmExperienceCrop;$('experienceCropCancel').onclick=closeExperienceCrop;$('experienceCropModal').onclick=event=>{if(event.target===$('experienceCropModal'))closeExperienceCrop()};$('saveExperience').onclick=saveExperience;
async function load(){try{const data=await api('/api/web/onsite');state.labels=data.contentLabels;state.mappings=data.mappings;state.templates=data.templates;state.experience=data.experience||null;state.selected=state.experience?.contentLabel||data.selectedContent?.[0]||'';state.fields={...(state.experience?.fields||{})};state.choices={...(state.experience?.choices||{})};state.rawText={...(state.experience?.rawText||{})};state.media=(state.experience?.media||state.experience?.mediaKeys?.map((key,index)=>({role:mediaSlots[index]?.role||'detail',key}))||[]).map(item=>({role:item.role,key:item.key,url:state.experience.mediaUrls?.[item.key]||`/api/assets/${item.key.split('/').map(encodeURIComponent).join('/')}`}));renderContent();renderEditor()}catch(error){$('loadEmpty').hidden=false;$('loadEmpty').textContent=error.message}}
load();
</script>
</body>
</html>
