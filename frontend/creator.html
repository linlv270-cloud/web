<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFE600">
<title>TDE 主理人图鉴</title>
<style>
*,*::before,*::after{box-sizing:border-box}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans SC","Microsoft YaHei",sans-serif;background:#f7f5f0;color:#222;line-height:1.65}.topbar{height:60px;border-bottom:3px solid #ffe600;background:#fff;display:flex;align-items:center;padding:0 max(16px,env(safe-area-inset-left));position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.badge{width:38px;height:38px;border:2px solid #222;border-radius:50%;background:#ffe600;display:grid;place-items:center;font-size:12px}.page{width:min(860px,100%);margin:auto;padding:24px 16px 64px}.portrait{border:2px solid #222;background:#fff}.hero-media{aspect-ratio:4/3;background:#e8e5de;overflow:hidden;display:grid;place-items:center}.hero-media img{width:100%;height:100%;object-fit:cover}.portrait-copy{padding:24px}.guide-number{font-size:11px;color:#666;letter-spacing:.08em}.portrait h1{font-size:32px;line-height:1.2;margin:6px 0 2px;overflow-wrap:anywhere}.display-title{font-weight:800}.line{margin-top:16px;white-space:pre-line}.portrait-section{padding-top:20px;margin-top:20px;border-top:2px dashed #e8e5de}.portrait-section h2{font-size:17px;margin:0 0 8px}.portrait-section p{margin:0;color:#555;white-space:pre-line}.supply,.tags{display:flex;flex-wrap:wrap;gap:8px}.supply span,.tags span{padding:6px 10px;border:1.5px solid #222;background:#fff3b0;font-size:12px}.supply span[data-source="self"]{background:#fff}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border:2px solid #222;background:#e8e5de}.empty{text-align:center;padding:96px 20px;color:#666}.empty strong{display:block;color:#222;font-size:20px;margin-bottom:8px}@media(max-width:560px){.page{padding:14px 12px 48px}.portrait-copy{padding:18px}.portrait h1{font-size:26px}.gallery{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="badge">TDE</span><span>TheDesignExpo · 主理人图鉴</span></div></header>
<main class="page" id="page"><div class="empty"><strong>正在加载主理人图鉴</strong><span>请稍候</span></div></main>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function section(title,content){return content?`<section class="portrait-section"><h2>${title}</h2>${content}</section>`:''}
async function init(){const params=new URLSearchParams(location.search),ref=params.get('portrait')||params.get('id')||'',page=document.getElementById('page');try{const res=await fetch('/api/public/creator?portrait='+encodeURIComponent(ref),{cache:'no-store'}),data=await res.json();if(!res.ok)throw new Error(data.error||'图鉴不存在');const p=data.portrait,supply=(p.supply||[]).map(item=>`<span data-source="${esc(item.source)}">${esc(item.label)}</span>`).join(''),tags=(p.tags||[]).map(label=>`<span>${esc(label)}</span>`).join(''),gallery=(p.imageUrls||[]).map((url,index)=>`<img src="${esc(url)}" alt="${esc(p.brandName)} 补充图片 ${index+1}" loading="lazy">`).join('');document.title=(p.brandName||'主理人')+' - TDE 主理人图鉴';page.innerHTML=`<article class="portrait"><div class="hero-media">${p.heroImageUrl?`<img src="${esc(p.heroImageUrl)}" alt="${esc(p.brandName)} 主图">`:'<strong>TDE</strong>'}</div><div class="portrait-copy"><div class="guide-number">${esc(p.guideNumber)}</div><h1>${esc(p.brandName||'主理人')}</h1>${p.displayTitle?`<div class="display-title">${esc(p.displayTitle)}</div>`:''}${p.representativeLine?`<p class="line">${esc(p.representativeLine)}</p>`:''}${section('来这里可以做什么',supply?`<div class="supply">${supply}</div>`:'')}${section('有一点不一样',p.difference?`<p>${esc(p.difference)}</p>`:'')}${section('你可能会记住',p.memory?`<p>${esc(p.memory)}</p>`:'')}${section('主理人自己说',(p.creatorSaid||[]).map(text=>`<p>${esc(text)}</p>`).join(''))}${section('体验标签',tags?`<div class="tags">${tags}</div>`:'')}${gallery?`<section class="portrait-section"><h2>更多图片</h2><div class="gallery">${gallery}</div></section>`:''}</div></article>`}catch(error){page.innerHTML=`<div class="empty"><strong>该图鉴暂未公开</strong><span>${esc(error.message||'请稍后再试')}</span></div>`}}
init();
</script>
</body>
</html>
