<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFE600">
<title>发现问答 - TheDesignExpo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#F7F5F0;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;padding:20px 14px 44px}.shell{width:min(100%,720px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.badge{width:40px;height:40px;border:2px solid #222;border-radius:50%;background:#FFE600;display:grid;place-items:center;font-size:12px}.brand small{display:block;font-size:9px;color:#666;letter-spacing:.12em}.brand strong{display:block;font-size:16px}.back{color:#283593;font-size:13px;font-weight:800;text-decoration:none}.progress{display:flex;gap:6px;margin-bottom:14px}.progress i{height:6px;flex:1;background:#ddd;border-radius:8px}.progress i.active{background:#FFE600;border:1px solid #222}.card{background:#fff;border:2px solid #222;border-radius:12px;box-shadow:4px 4px 0 #222;padding:26px}.eyebrow{font-size:12px;color:#E53935;font-weight:900;margin-bottom:10px}.card h1{margin:0;font-size:28px;line-height:1.35}.lead{margin:10px 0 24px;color:#666;font-size:14px;line-height:1.75}.group{margin:22px 0}.group h2{margin:0 0 9px;font-size:15px}.group p{margin:0 0 10px;color:#777;font-size:12px;line-height:1.6}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:9px 12px;border:1.5px solid #bbb;border-radius:8px;background:#fff;font:inherit;font-size:13px;cursor:pointer}.chip.selected{border-color:#222;background:#FFE600;font-weight:800}.field{margin-top:20px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field textarea{width:100%;min-height:120px;padding:11px 12px;border:2px solid #222;border-radius:8px;background:#fff;font:inherit;font-size:16px;line-height:1.7;resize:vertical}.hint{padding:13px;background:#FFF3B0;border-left:4px solid #222;color:#555;font-size:12px;line-height:1.7}.media{margin-top:14px}.media-grid{display:flex;gap:10px;flex-wrap:wrap}.media-card{width:92px;height:92px;position:relative;border:1.5px solid #bbb;border-radius:8px;overflow:hidden;background:#f3f1ec}.media-card img{width:100%;height:100%;object-fit:cover}.media-card button{position:absolute;right:3px;top:3px;width:24px;height:24px;border:1px solid #222;border-radius:50%;background:#fff;font-size:16px;line-height:18px;cursor:pointer}.upload{width:92px;height:92px;border:2px dashed #888;border-radius:8px;display:grid;place-items:center;color:#555;font-size:12px;text-align:center;cursor:pointer}.upload input{display:none}.save{min-height:24px;margin-top:16px;color:#666;font-size:12px}.save.error{color:#E53935}.save.success{color:#00897B}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:11px 18px;border:2px solid #222;border-radius:8px;background:#FFE600;color:#222;text-decoration:none;font:inherit;font-size:14px;font-weight:800;box-shadow:0 3px 0 #222;cursor:pointer}.button.secondary{background:#fff}.button:disabled{opacity:.5;cursor:not-allowed}.empty{text-align:center;color:#777;padding:28px 0}.footer{margin-top:18px;text-align:center;color:#777;font-size:12px}@media(max-width:480px){body{padding:14px 11px 34px}.card{padding:20px}.top{align-items:flex-start}.card h1{font-size:25px}.button{width:100%}.actions{display:grid}.media-card,.upload{width:82px;height:82px}}
</style>
</head>
<body>
<main class="shell">
  <div class="top"><div class="brand"><div class="badge">TDE</div><div><small>THE DESIGN EXPO</small><strong>奇灯主理人</strong></div></div><a class="back" href="profile.html?section=brand">返回个人中心</a></div>
  <div class="progress" id="progress" aria-label="发现问答进度"></div>
  <section class="card" id="app"><div class="empty">正在加载...</div></section>
  <div class="footer">已回答的内容会自动保存，之后可以回来继续。</div>
</main>
<script>
const $=id=>document.getElementById(id),token=()=>localStorage.getItem('tde_token')||'',headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token()}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let bundle=null,index=0,draft={},mediaDraft=[],saving=false,uploading=false;
const keys=['q1_identity_category','q2_supply_experience','q3_difference','q4_memory','q5_audience','q6_style'];
const labels={R:'主理人身份',I:'内容品类',O:'你能提供什么',X:'现场可以怎样参与',P:'容易喜欢你的人',S:'更接近的感觉'};
function answer(){return bundle?.answers?.find(item=>item.questionKey===keys[index])||null}
function selections(){return draft.selections||(draft.selections={})}
function selected(namespace,key){return (selections()[namespace]||[]).includes(key)}
function toggleTerm(namespace,key){const list=new Set(selections()[namespace]||[]);list.has(key)?list.delete(key):list.add(key);selections()[namespace]=[...list];render();scheduleSave()}
function toggleStructured(value){const list=new Set(selections().structured||[]);list.has(value)?list.delete(value):list.add(value);selections().structured=[...list];render();scheduleSave()}
function setText(value){draft.originalText=value;scheduleSave()}
function setStatus(message,type=''){const el=$('saveStatus');if(el){el.textContent=message;el.className='save '+type}}
function renderProgress(){const current=index; $('progress').innerHTML=keys.map((_,i)=>`<i class="${i<=current?'active':''}"></i>`).join('')}
function group(namespace){const terms=(bundle.taxonomy||[]).filter(item=>item.namespace===namespace);return `<div class="group"><h2>${labels[namespace]}</h2><div class="chips">${terms.map(term=>`<button type="button" class="chip ${selected(namespace,term.termKey)?'selected':''}" onclick="toggleTerm('${namespace}','${term.termKey}')">${esc(term.label)}</button>`).join('')}</div></div>`}
function mediaMarkup(){return `<div class="media"><div class="group"><h2>回答图片（选填）</h2><p>可以放一张能说明你不同之处的真实图片。</p></div><div class="media-grid">${mediaDraft.map((item,i)=>`<div class="media-card"><img src="${esc(item.url||'')}" alt="回答图片"><button type="button" aria-label="删除图片" onclick="removeMedia(${i})">×</button></div>`).join('')}<label class="upload">+<span>添加图片</span><input type="file" accept="image/*" onchange="uploadMedia(this)"></label></div></div>`}
function render(){if(!bundle)return;renderProgress();const q=bundle.questions[index],a=answer();const body=[];if(q.key==='q1_identity_category')body.push(group('R'),group('I'));if(q.key==='q2_supply_experience')body.push(group('O'),group('X'));if(q.key==='q5_audience')body.push(group('P'));if(q.key==='q6_style')body.push(group('S'));if(q.key==='q3_difference'||q.key==='q4_memory'){const opts=bundle.structuredOptions[q.key]||[];body.push(`<div class="group"><h2>${q.key==='q3_difference'?'先选一个你想表达的方向':'你希望他记住的方向'}</h2><div class="chips">${opts.map(value=>`<button type="button" class="chip ${(selections().structured||[]).includes(value)?'selected':''}" onclick="toggleStructured('${esc(value)}')">${esc(value)}</button>`).join('')}</div></div>`);body.push(`<div class="field"><label>${q.key==='q3_difference'?'想多说一点吗？':'自己写一句（选填）'}</label><textarea maxlength="${q.key==='q3_difference'?1000:300}" oninput="setText(this.value)" placeholder="${q.key==='q3_difference'?'用你自己的话说说哪里不一样。':'这句话不需要写得漂亮，像你平时说话就好。'}">${esc(draft.originalText||'')}</textarea></div>`);if(q.key==='q3_difference')body.push(mediaMarkup())}
const previous=index?`<button type="button" class="button secondary" onclick="navigate(-1)">上一题</button>`:'<span></span>';const next=index===keys.length-1?'看看我们开始认识你了':'下一题';$('app').innerHTML=`<div class="eyebrow">第 ${index+1} / 6 题</div><h1>${esc(q.title)}</h1><p class="lead">${esc(q.hint)}</p>${body.join('')}<div id="saveStatus" class="save"></div><div class="actions">${previous}<button type="button" class="button" id="nextButton" onclick="${index===keys.length-1?'complete()':'navigate(1)'}">${next}</button></div>`}
function loadDraft(){const a=answer();draft={selections:JSON.parse(JSON.stringify(a?.selections||{})),originalText:a?.originalText||''};mediaDraft=(a?.media||[]).map(item=>({...item,url:item.url||''}))}
async function json(res){try{return await res.json()}catch{return{}}}
async function call(action,body={}){const res=await fetch('/api/web/discovery',{method:'POST',headers:headers(),body:JSON.stringify({action,...body})}),data=await json(res);if(!res.ok)throw new Error(data.error||'保存失败');return data}
function scheduleSave(){clearTimeout(window.discoverySaveTimer);setStatus('有更改尚未保存');window.discoverySaveTimer=setTimeout(()=>persist(false),500)}
let exitSaveSent=false;
function flushPendingSave(){if(exitSaveSent||!bundle||!draft||saving||uploading)return;clearTimeout(window.discoverySaveTimer);exitSaveSent=true;const body={action:'saveAnswer',questionKey:keys[index],version:bundle.version,selections:draft.selections,originalText:draft.originalText,media:mediaDraft.map(item=>({key:item.key,visibility:item.visibility||'private'}))};void fetch('/api/web/discovery',{method:'POST',headers:headers(),body:JSON.stringify(body),keepalive:true}).catch(()=>{})}
async function persist(showSaved=true){if(saving||uploading)return false;saving=true;setStatus('正在保存...');try{const payload=await call('saveAnswer',{questionKey:keys[index],version:bundle.version,selections:draft.selections,originalText:draft.originalText,media:mediaDraft.map(item=>({key:item.key,visibility:item.visibility||'private'}))});bundle=payload;loadDraft();render();if(showSaved)setStatus('已自动保存','success');return true}catch(error){setStatus(error.message,'error');return false}finally{saving=false}}
async function navigate(delta){if(!(await persist(false)))return;index=Math.max(0,Math.min(keys.length-1,index+delta));loadDraft();render()}
async function complete(){const button=$('nextButton');button.disabled=true;if(!(await persist(false))){button.disabled=false;return}try{bundle=await call('complete');location.href='discovery-feedback.html'}catch(error){setStatus(error.message,'error');button.disabled=false}}
async function uploadMedia(input){const file=input.files?.[0];input.value='';if(!file)return;if(!file.type.startsWith('image/')){setStatus('请选择图片文件','error');return}if(file.size>20*1024*1024){setStatus('图片不能超过20MB','error');return}uploading=true;setStatus('正在上传图片...');try{const form=new FormData();form.set('file',file);const res=await fetch('/api/web/upload',{method:'POST',headers:{Authorization:'Bearer '+token()},body:form}),data=await json(res);if(!res.ok)throw new Error(data.error||'图片上传失败');mediaDraft.push({key:data.key,url:URL.createObjectURL(file),visibility:'private'});render();await persist(false)}catch(error){setStatus(error.message,'error')}finally{uploading=false}}
function removeMedia(i){mediaDraft.splice(i,1);render();scheduleSave()}
async function init(){if(!token()){location.href='login.html?next=discovery.html';return}try{const res=await fetch('/api/web/discovery',{headers:{Authorization:'Bearer '+token()},cache:'no-store'});if(res.status===401){location.href='login.html?next=discovery.html';return}if(!res.ok)throw new Error('发现问答加载失败');bundle=await res.json();if(bundle.session.status==='feedback'){location.href='discovery-feedback.html';return}const savedIndex=keys.indexOf(bundle.session.currentQuestionKey);const firstMissing=keys.findIndex(key=>!bundle.answers.some(a=>a.questionKey===key));index=savedIndex>=0&&firstMissing<0?savedIndex:(firstMissing>=0?firstMissing:0);loadDraft();render()}catch(error){$('app').innerHTML=`<div class="empty">${esc(error.message)}</div>`}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')exitSaveSent=false;else if(document.visibilityState==='hidden')flushPendingSave()});
window.addEventListener('pagehide',flushPendingSave);
init();
</script>
</body>
</html>
