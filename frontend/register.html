<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<script src="creator-entry.js"></script>
<title>注册｜奇灯®TDE 主理人端</title>
<style>
:root{
  --ink:#0E0E0E;
  --body:#141414;
  --sub:#4A4A4A;
  --line:#7C7872;
  --paper:#FAF7F2;
  --accent:#D9581E;
  --link:#93330C;
  --focus:#1A4FD6;
  --error:#A32D2D;
  --success:#2A9D7E;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}button,input{font:inherit}
.top{max-width:900px;margin:0 auto;padding:16px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:21px;font-weight:600;letter-spacing:.5px}
.back{font-size:15px;color:var(--sub);padding:8px 0}
.back:hover,.back:focus-visible{color:var(--ink)}
.auth-shell{max-width:900px;margin:0 auto;padding:clamp(28px,7vh,64px) 16px 48px}
.auth-intro{max-width:540px;margin-bottom:24px}
.auth-intro p{margin:0;color:var(--body);font-size:17px;line-height:1.6}
.auth-form{max-width:460px;border-top:1px solid var(--ink);padding-top:22px}
.field{margin-bottom:16px}
.field label{display:block;margin-bottom:6px;font-size:15px;font-weight:600;color:var(--body)}
.field input{width:100%;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);outline:0;font-size:17px}
.field input::placeholder{color:var(--sub)}
.field input:focus{outline:3px solid var(--focus);outline-offset:0;border-color:var(--line)}
.password-wrap{position:relative}
.password-wrap input{padding-right:44px}
.password-toggle{position:absolute;right:0;top:0;width:44px;height:52px;border:0;background:transparent;color:var(--sub);font-size:18px;cursor:pointer}
.password-toggle:hover,.password-toggle:focus-visible{color:var(--ink)}
.password-toggle:focus-visible{outline:3px solid var(--focus);outline-offset:0}
.invite-hint{margin:2px 0 16px;color:var(--sub);font-size:13px;line-height:1.7}
.hint{margin:2px 0 20px;padding-left:12px;border-left:2px solid var(--line);color:var(--sub);font-size:13px;line-height:1.7}
.agreement{display:flex;align-items:flex-start;gap:12px;margin:4px 0 16px;color:var(--body);font-size:17px;line-height:1.6}
.agreement input{width:24px;height:24px;margin-top:2px;accent-color:var(--accent);flex:none}
.agreement a{text-decoration:underline;text-underline-offset:3px}
.primary{width:100%;height:52px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:17px;font-weight:600;border-radius:4px;cursor:pointer}
.primary:hover{background:#262626}
.primary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.primary:disabled{opacity:.55;cursor:wait}
.status{min-height:20px;margin-top:14px;color:var(--sub);font-size:13px;line-height:1.6}
.status.error{color:var(--error)}
.status.success{color:var(--success)}
.switch{display:flex;flex-direction:column;gap:4px;margin-top:20px;font-size:15px;color:var(--sub)}
.switch a{color:var(--link)}
.switch a:hover,.switch a:focus-visible{color:var(--ink)}
.success{display:none;max-width:460px;border-top:1px solid var(--ink);padding-top:22px}
.success.show{display:block}
.success h2{margin:0 0 10px;font-size:24px;color:var(--ink)}
.success p{margin:0;color:var(--body);font-size:17px;line-height:1.6}
.success a{display:inline-flex;align-items:center;justify-content:center;width:100%;height:52px;margin-top:20px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:17px;font-weight:600;border-radius:4px}
.success a:hover{background:#262626}
.success a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media(max-width:520px){.top{padding:14px}.brand{font-size:18px}.auth-shell{padding:36px 14px 32px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="index.html">奇灯®TDE</a><a class="back" href="login.html">已有账号，登录</a></header>
<main class="auth-shell">
  <form class="auth-form" id="registerForm">
    <div class="field"><label for="inviteCode">邀请码</label><input id="inviteCode" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="请输入邀请码" required><p class="invite-hint">联系官方微信aaabht获取邀请码。</p></div>
    <div class="field"><label for="phone">手机号</label><input id="phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="请输入手机号" required></div>
    <div class="field"><label for="password">初始密码</label><div class="password-wrap"><input id="password" type="password" inputmode="numeric" maxlength="11" autocomplete="new-password" placeholder="再次输入手机号" required><button class="password-toggle" id="passwordToggle" type="button" aria-label="显示密码" title="显示或隐藏密码">◎</button></div></div>
    <p class="hint">再次填写手机号作为初始密码</p>
    <label class="agreement"><input id="agreed" type="checkbox"><span>我已阅读并同意 <a href="terms.html" target="_blank">《用户协议》</a> 和 <a href="privacy.html" target="_blank">《隐私政策》</a></span></label>
    <button class="primary" id="registerButton" type="submit">注册并继续</button>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="switch"><span>已有账号？</span><a href="login.html">直接登录</a></div>
  </form>
</main>
<script>
const $=id=>document.getElementById(id);
function setStatus(message,type=""){$("status").textContent=message;$("status").className=`status ${type}`}
function togglePassword(){const input=$("password"),button=$("passwordToggle"),show=input.type==="password";input.type=show?"text":"password";button.textContent=show?"◉":"◎";button.setAttribute("aria-label",show?"隐藏密码":"显示密码")}
$("passwordToggle").addEventListener("click",togglePassword);
$("inviteCode").addEventListener("input",event=>{event.target.value=event.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"")});
$("registerForm").addEventListener("submit",async event=>{
  event.preventDefault();setStatus("");
  const inviteCode=$("inviteCode").value.trim().toUpperCase(),phone=$("phone").value.trim(),password=$("password").value;
  if(!/^[A-Z0-9]{4,8}$/.test(inviteCode))return setStatus("请填写4-8位字母或数字的邀请码","error");
  if(!/^1\d{10}$/.test(phone))return setStatus("请填写正确的手机号","error");
  if(password!==phone)return setStatus("初始密码必须与手机号相同","error");
  if(!$("agreed").checked)return setStatus("请先阅读并同意用户协议和隐私政策","error");
  const button=$("registerButton");button.disabled=true;button.textContent="注册中…";
  try{
    const response=await fetch("/api/web/auth/register-account",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({flow:"creator-v1",inviteCode,phone,password,agreed:true})});
    let payload={};try{payload=await response.json()}catch{}
    if(!response.ok)throw new Error(payload.error||"注册失败");
    if(!payload.session?.token)throw new Error("注册结果不完整，请重试");
    localStorage.setItem("tde_token",payload.session.token);localStorage.setItem("tde_creator",JSON.stringify(payload.creator||{}));
    setTimeout(()=>window.tdeCreatorEntry.redirectAfterAuth(payload.session.token).catch(error=>{
      if(error.message==="SESSION_INVALID")location.replace("login.html");
    }),500);
  }catch(error){setStatus(error.message||"注册失败","error")}finally{button.disabled=false;button.textContent="注册并继续"}
});
</script>
</body>
</html>
