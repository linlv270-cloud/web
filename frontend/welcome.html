<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFE600">
<title>开始认识我 - TheDesignExpo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#F7F5F0;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;display:grid;place-items:center;padding:24px}
.shell{width:min(100%,560px)}.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;font-weight:900}.badge{width:44px;height:44px;border:2px solid #222;border-radius:50%;background:#FFE600;display:grid;place-items:center;font-size:13px}.brand small{display:block;font-size:10px;color:#666;letter-spacing:.12em}.brand strong{display:block;font-size:18px}
.intro{background:#fff;border:2px solid #222;border-radius:12px;box-shadow:5px 5px 0 #222;padding:32px}.eyebrow{font-size:12px;font-weight:800;color:#E53935;margin-bottom:12px}.intro h1{margin:0;font-size:clamp(30px,7vw,52px);line-height:1.12;letter-spacing:0}.intro p{margin:18px 0 0;color:#666;font-size:15px;line-height:1.8}.privacy{margin-top:20px;padding:14px;background:#FFF3B0;border-left:4px solid #222;font-size:13px;line-height:1.7}.actions{display:grid;gap:10px;margin-top:28px}.button{display:flex;align-items:center;justify-content:center;min-height:50px;padding:12px 18px;border:2px solid #222;border-radius:8px;background:#FFE600;color:#222;font-size:15px;font-weight:800;text-decoration:none;box-shadow:0 3px 0 #222}.button.secondary{background:#fff}.button:active{transform:translateY(2px);box-shadow:0 1px 0 #222}.foot{margin-top:18px;text-align:center;color:#666;font-size:12px}
@media(max-width:480px){body{padding:16px}.intro{padding:24px}.intro h1{font-size:34px}}
</style>
</head>
<body>
<main class="shell">
  <div class="brand"><div class="badge">TDE</div><div><small>THE DESIGN EXPO</small><strong>奇灯主理人</strong></div></div>
  <section class="intro">
    <div class="eyebrow">开始建立你的长期档案</div>
    <h1>让别人知道，<br>你真正特别在哪里。</h1>
    <p>建立你的奇灯主理人档案。奇灯会逐渐了解你在做什么，也让合适的活动更容易找到你。</p>
    <p>未来完成建档以后，可以获得自己的《奇灯主理人图鉴》。</p>
    <div class="privacy">你可以决定哪些内容公开，哪些只让奇灯看到。</div>
    <div class="actions">
      <a class="button" href="onboarding.html">开始认识我</a>
      <a class="button secondary" href="login.html?next=onboarding.html">已有账号，直接登录</a>
    </div>
  </section>
  <div class="foot"><a href="index.html">返回 TDE 首页</a></div>
</main>
</body>
</html>
