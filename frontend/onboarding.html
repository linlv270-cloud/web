<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFE600">
<title>建立主理人档案 - TheDesignExpo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#F7F5F0;color:#222;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;padding:24px 16px 48px}.shell{width:min(100%,720px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.badge{width:40px;height:40px;border:2px solid #222;border-radius:50%;background:#FFE600;display:grid;place-items:center;font-size:12px}.brand small{display:block;font-size:9px;color:#666;letter-spacing:.12em}.brand strong{display:block;font-size:16px}.back{color:#283593;font-size:13px;font-weight:700;text-decoration:none}.progress{display:flex;gap:6px;margin-bottom:14px}.progress i{height:5px;flex:1;background:#ddd;border-radius:10px}.progress i.active{background:#FFE600;border:1px solid #222}.card{background:#fff;border:2px solid #222;border-radius:12px;box-shadow:4px 4px 0 #222;padding:26px}.card h1{margin:0;font-size:26px;line-height:1.3}.card>p{color:#666;font-size:14px;line-height:1.75;margin:10px 0 22px}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field input,.field select{width:100%;min-height:48px;padding:10px 12px;border:2px solid #222;border-radius:8px;background:#fff;font:inherit;font-size:16px}.field-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.agreement{display:flex;align-items:flex-start;gap:7px;color:#666;font-size:12px;line-height:1.7}.agreement a{color:#283593;font-weight:700}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:11px 18px;border:2px solid #222;border-radius:8px;background:#FFE600;color:#222;font:inherit;font-size:14px;font-weight:800;box-shadow:0 3px 0 #222;cursor:pointer}.button.secondary{background:#fff}.button:disabled{opacity:.5;cursor:not-allowed}.status{min-height:22px;margin-top:14px;font-size:13px;color:#666}.status.error{color:#E53935}.status.success{color:#00897B}.hint{padding:13px;background:#FFF3B0;border-left:4px solid #222;color:#555;font-size:13px;line-height:1.7;margin:14px 0}.image-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.image-card{border:2px dashed #aaa;border-radius:8px;padding:14px;min-height:220px;display:flex;flex-direction:column;gap:10px}.image-card.required{border-color:#222}.image-card h2{font-size:15px;margin:0}.image-preview{width:100%;aspect-ratio:4/3;background:#f2f2f2;border-radius:6px;object-fit:cover;display:block}.image-preview.logo{aspect-ratio:1}.image-empty{display:grid;place-items:center;flex:1;min-height:130px;color:#888;background:#f7f5f0;border-radius:6px;text-align:center;font-size:13px}.schedule-frame{display:block;width:100%;height:760px;border:0;margin-top:4px}.done{text-align:center;padding:30px 8px}.done strong{display:block;font-size:24px;margin-bottom:10px}.done p{color:#666;line-height:1.8}.hidden{display:none!important}.loading{text-align:center;color:#666;padding:60px 0}@media(max-width:560px){body{padding:16px 12px 36px}.card{padding:20px}.field-row{grid-template-columns:1fr}.image-grid{grid-template-columns:1fr}.schedule-frame{height:700px}.top{align-items:flex-start}}
</style>
</head>
<body>
<main class="shell">
  <div class="top"><div class="brand"><div class="badge">TDE</div><div><small>THE DESIGN EXPO</small><strong>奇灯主理人</strong></div></div><a class="back" href="index.html">返回首页</a></div>
  <div class="progress" aria-label="建档进度"><i data-progress="register"></i><i data-progress="basics"></i><i data-progress="images"></i><i data-progress="schedule"></i></div>
  <section class="card" id="app"><div class="loading">正在加载...</div></section>
</main>
<script>
const $=id=>document.getElementById(id),token=()=>localStorage.getItem('tde_token')||'',headers=()=>({'Content-Type':'application/json','Authorization':'Bearer '+token()});
let data=null,creator=null,locations=[],step='register',imageDraft={logoImageKey:'',boothImageKey:''},imageUrls={};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(res){try{return await res.json()}catch{return{}}}
function setStatus(message,type=''){const el=$('status');if(el){el.textContent=message;el.className='status '+type}}
function setStep(value){step=value;document.querySelectorAll('[data-progress]').forEach((el,index)=>{const order=['register','basics','images','schedule'];el.classList.toggle('active',index<=order.indexOf(step))})}
async function api(action,body={}){const res=await fetch('/api/web/profile',{method:'POST',headers:headers(),body:JSON.stringify({action,...body})}),bodyJson=await json(res);if(!res.ok)throw new Error(bodyJson.error||'保存失败');return bodyJson}
async function loadLocations(){const res=await fetch('/api/public/locations');const body=await res.json();locations=body.provinces||[]}
function locationMarkup(){return `<div class="field-row"><div class="field"><label>省 <b>*</b></label><select id="province"><option value="">请选择省</option>${locations.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>市 <b>*</b></label><select id="city" disabled><option value="">请选择市</option></select></div><div class="field"><label>区/县 <b>*</b></label><select id="district" disabled><option value="">请选择区/县</option></select></div></div>`}
function bindLocation(){const p=$('province'),c=$('city'),d=$('district');p.value=creator?.province||'';renderCities();c.value=creator?.city||'';renderDistricts();d.value=creator?.district||'';p.onchange=()=>{renderCities();renderDistricts()};c.onchange=renderDistricts}
function renderCities(){const p=locations.find(item=>item.name===$('province')?.value),c=$('city');if(!c)return;c.innerHTML='<option value="">请选择市</option>'+(p?.cities||[]).map(item=>`<option>${esc(item.name)}</option>`).join('');c.disabled=!p}
function renderDistricts(){const p=locations.find(item=>item.name===$('province')?.value),city=p?.cities?.find(item=>item.name===$('city')?.value),d=$('district');if(!d)return;d.innerHTML='<option value="">请选择区/县</option>'+(city?.districts||[]).map(item=>`<option>${esc(item.name)}</option>`).join('');d.disabled=!city}
function renderRegister(){setStep('register');$('app').innerHTML=`<h1>先从一个账号开始</h1><p>注册后，我们会带你一步一步建立主理人档案。</p><div class="field"><label>手机号 <b>*</b></label><input id="phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="11位手机号"></div><div class="field"><label>再次输入手机号 <b>*</b></label><input id="confirmPhone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="请再次输入手机号"></div><div class="field"><label>密码 <b>*</b></label><input id="password" type="password" autocomplete="new-password" placeholder="8-72位字符"></div><div class="field"><label>再次输入密码 <b>*</b></label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="请再次输入密码"></div><label class="agreement"><input id="agreed" type="checkbox"><span>我已阅读并同意 <a href="terms.html" target="_blank">《用户协议》</a> 和 <a href="privacy.html" target="_blank">《隐私政策》</a></span></label><div id="status" class="status"></div><div class="actions"><button class="button" id="registerButton" onclick="register()">注册并继续</button><a class="button secondary" href="login.html?next=onboarding.html">已有账号，直接登录</a></div>`}
async function register(){const button=$('registerButton');button.disabled=true;setStatus('正在注册...');try{const body={flow:'phase2a',phone:$('phone').value.trim(),confirmPhone:$('confirmPhone').value.trim(),password:$('password').value,confirmPassword:$('confirmPassword').value,agreed:$('agreed').checked};const res=await fetch('/api/web/auth/register-account',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),payload=await json(res);if(!res.ok)throw new Error(payload.error||'注册失败');localStorage.setItem('tde_token',payload.session.token);localStorage.setItem('tde_creator',JSON.stringify(payload.creator||{}));await loadProfile();setStatus('注册成功','success')}catch(e){setStatus(e.message,'error')}finally{button.disabled=false}}
async function loadProfile(){const res=await fetch('/api/web/profile',{headers:{Authorization:'Bearer '+token()},cache:'no-store'});if(res.status===401){localStorage.removeItem('tde_token');localStorage.removeItem('tde_creator');renderRegister();return}if(!res.ok)throw new Error('档案加载失败');data=await res.json();creator=data.creator;const phase=data.creator?.onboarding?.phase2A;if(!phase?.startedAt){location.replace(`profile.html?section=${creator?.scheduleConfirmedAt?'brand':'schedule'}`);return}if(!phase.basicsCompleted)renderBasics();else if(!phase.imagesCompleted)renderImages();else if(!phase.scheduleConfirmed)renderSchedule();else renderDone()}
function renderBasics(){setStep('basics');$('app').innerHTML=`<h1>先让我们知道你是谁</h1><p>只填写最必要的信息。以后还可以随时回来修改。</p><div class="field"><label>大家平时怎么称呼你或你的品牌 <b>*</b></label><input id="brandName" maxlength="40" value="${esc(creator?.brandName||'')}" placeholder="例如：慢慢开张"></div>${locationMarkup()}<div id="status" class="status"></div><div class="actions"><button class="button" id="basicsButton" onclick="saveBasics()">保存并继续</button></div>`;bindLocation()}
async function saveBasics(){const button=$('basicsButton');button.disabled=true;setStatus('正在保存...');try{const brandName=$('brandName').value.trim(),province=$('province').value,city=$('city').value,district=$('district').value;if(!brandName)throw new Error('请填写主理人或品牌名称');if(!province||!city||!district)throw new Error('请选择完整的省、市、区');await api('updateProfile',{brandName});await api('updateLocation',{province,city,district});await loadProfile()}catch(e){setStatus(e.message,'error')}finally{button.disabled=false}}
async function loadPrivateImage(url){try{const res=await fetch(url,{headers:{Authorization:'Bearer '+token()},cache:'no-store'});if(!res.ok)return '';return URL.createObjectURL(await res.blob())}catch{return ''}}
async function renderImages(){setStep('images');imageDraft={logoImageKey:creator?.logoImageKey||creator?.logoKey||'',boothImageKey:creator?.boothImageKey||''};imageUrls={logoImageKey:'',boothImageKey:''};$('app').innerHTML=`<h1>留下两张真实照片</h1><p>LOGO 和至少一张以往真实摆台 / 陈列图是首次建档的基础。其他图片之后再补也可以。</p><div class="hint">必填不等于公开。图片的公开范围会在后续资料管理中继续完善。</div><div class="image-grid">${imageCard('logoImageKey','LOGO','logo')}${imageCard('boothImageKey','以往摆台 / 陈列图','')}</div><div id="status" class="status"></div><div class="actions"><button class="button" id="imagesButton" onclick="saveImagesStep()">保存并继续</button></div>`;for(const [key,url] of [['logoImageKey',creator?.logoImageUrl||''],['boothImageKey',creator?.boothImageUrl||'']]){if(url){imageUrls[key]=await loadPrivateImage(url);const img=$(`preview-${key}`);if(img&&imageUrls[key]){img.src=imageUrls[key];img.hidden=false;$(`empty-${key}`).hidden=true}}}}
function imageCard(key,label,kind){return `<article class="image-card required"><h2>${label} <b>*</b></h2><img id="preview-${key}" class="image-preview ${kind}" alt="${label}" hidden><div id="empty-${key}" class="image-empty">还没有图片</div><button class="button secondary" type="button" onclick="chooseImage('${key}')">拍照或选择图片</button><input id="input-${key}" type="file" accept="image/*" hidden></article>`}
function chooseImage(key){const input=$(`input-${key}`);input.onchange=async()=>{const file=input.files?.[0];input.value='';if(!file)return;if(!file.type.startsWith('image/')){setStatus('请选择图片文件','error');return}if(file.size>20*1024*1024){setStatus('图片不能超过20MB','error');return}const preview=$(`preview-${key}`);if(imageUrls[key])URL.revokeObjectURL(imageUrls[key]);imageUrls[key]=URL.createObjectURL(file);preview.src=imageUrls[key];preview.hidden=false;$(`empty-${key}`).classList.add('hidden');try{const form=new FormData();form.set('file',file);setStatus(`正在上传${key==='logoImageKey'?'LOGO':'摆台图片'}...`);const res=await fetch('/api/web/upload',{method:'POST',headers:{Authorization:'Bearer '+token()},body:form}),payload=await json(res);if(!res.ok)throw new Error(payload.error||'上传失败');imageDraft[key]=payload.key;await api('updateImages',{[key]:payload.key});setStatus('图片已保存','success')}catch(e){setStatus(e.message,'error')}};input.click()}
async function saveImagesStep(){const button=$('imagesButton');button.disabled=true;try{if(!imageDraft.logoImageKey)throw new Error('请上传 LOGO');if(!imageDraft.boothImageKey)throw new Error('请上传至少一张以往摆台 / 陈列图');await loadProfile()}catch(e){setStatus(e.message,'error')}finally{button.disabled=false}}
function renderSchedule(){setStep('schedule');$('app').innerHTML=`<h1>最近的档期确认一下</h1><p>标记你已经有安排的日期，奇灯会尽量避开这些时间邀请你。</p><div class="hint">只需要维护“已经有安排的日期”。不需要填写活动名称、地点或原因。</div><iframe class="schedule-frame" src="schedule.html?embed=schedule&phase=2a" title="我的档期"></iframe><div id="status" class="status"></div>`}
    function renderDone(){setStep('schedule');const discoveryDone=creator?.onboarding?.phase2A?.discoveryCompleted;const discoveryHref=discoveryDone?'discovery-feedback.html':'discovery.html';const discoveryLabel=discoveryDone?'查看我们的理解':'继续认识我';$('app').innerHTML=`<div class="done"><strong>基础档案已经建立</strong><p>${discoveryDone?'你的发现问答已经完成，可以随时回来查看或调整确认内容。':'接下来，我们想再用 6 个问题认识你。每一步都会自动保存，可以随时回来继续。'}</p><div class="actions"><a class="button" href="${discoveryHref}">${discoveryLabel}</a><a class="button secondary" href="profile.html?section=brand">进入我的资料</a><a class="button secondary" href="profile.html?section=schedule">查看我的档期</a></div></div>`}
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='tde-schedule-saved')return;loadProfile().catch(error=>setStatus(error.message,'error'))});
(async()=>{try{if(!token()){renderRegister();await loadLocations();return}await loadLocations();await loadProfile()}catch(error){$('app').innerHTML=`<div class="done"><strong>加载失败</strong><p>${esc(error.message)}</p><div class="actions"><a class="button" href="welcome.html">返回</a></div></div>`}})();
</script>
</body>
</html>
