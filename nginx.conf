limit_req_zone $binary_remote_addr zone=tde_api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=tde_general_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name tde.thedesignexpo.org.cn viz.thedesignexpo.org.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tde.thedesignexpo.org.cn;

    ssl_certificate /etc/letsencrypt/live/tde.thedesignexpo.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tde.thedesignexpo.org.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/tde/frontend;
    index index.html;
    client_max_body_size 20m;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = / {
        try_files /index.html =404;
    }

    location ^~ /api/ {
        limit_req zone=tde_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /admin {
        limit_req zone=tde_general_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ @tde_backend;
    }

    location @tde_backend {
        limit_req zone=tde_general_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name viz.thedesignexpo.org.cn;

    ssl_certificate /etc/letsencrypt/live/viz.thedesignexpo.org.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viz.thedesignexpo.org.cn/privkey.pem;
